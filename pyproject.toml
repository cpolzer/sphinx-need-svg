[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphinx-need-svg"
version = "0.2.0"
description = "Sphinx-Needs extension for SVG diagrams with clickable need links"
requires-python = ">=3.9"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "sphinx>=5.0",
    "sphinx-needs>=2.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-regressions", "sphinx-need-svg[docs]"]
docs = ["sphinx", "sphinx-needs", "furo", "myst-parser"]
dev = [
    "sphinx-need-svg[test,docs]",
    "ruff",
    "mypy",
    "commitizen",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_need_svg"]

[tool.ruff]
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["sphinx_need_svg"]
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sphinx_needs.*",
    "docutils.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = [
    "pyproject.toml:^version",
    "src/sphinx_need_svg/__init__.py:version",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
