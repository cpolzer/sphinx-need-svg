[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphinx-needs-svg"
version = "0.1.0"
description = "Sphinx-Needs extension for SVG diagrams with clickable need links"
requires-python = ">=3.9"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "sphinx>=5.0",
    "sphinx-needs>=2.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-regressions"]
docs = ["sphinx", "sphinx-needs", "alabaster"]
dev = [
    "sphinx-needs-svg[test,docs]",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_needs_svg"]

[tool.ruff]
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["sphinx_needs_svg"]
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sphinx_needs.*",
    "docutils.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
